<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cherry Pit</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="provenance-canary" role="status" aria-live="polite">
      <strong>PROVENANCE BUILD</strong>
      <span id="provenance-values">loading provenance…</span>
    </div>
    <main class="application">
      <aside class="rail" aria-label="Future project navigation">
        <div class="brand"><img src="../assets/cherry-pit-mark.png" alt="" /><span>Cherry<br />Pit</span></div>
        <nav>
          <button class="nav-link selected" type="button" disabled><i class="diamond" aria-hidden="true"></i><span>Projects</span></button>
          <button class="nav-link" type="button" disabled><i class="house" aria-hidden="true"></i><span>Home</span></button>
          <button class="nav-link" type="button" disabled><i class="folder" aria-hidden="true"></i><span>Library</span></button>
        </nav>
      </aside>

      <section class="workspace">
        <img class="workspace-world" src="../assets/moonlit-sky-background.png" alt="" />
        <header class="workspace-header">
          <div><span class="context-label">Project / Alter</span><h1>Untitled workspace</h1></div>
          <button class="runtime-menu" type="button" disabled title="Runtime menu" aria-label="Runtime menu">•••</button>
        </header>

        <section class="alter-deck" aria-label="Placeholder Alter deck">
          <div class="alter-line" aria-hidden="true"></div>
          <div class="alter-slots">
            <button class="alter rest" type="button" disabled><img src="../assets/alter-tabs/cherry-tab-rest.png" alt="" /><span><b>Elliot</b><small>Manager</small></span><em>⌄</em></button>
            <button class="alter selected" type="button" disabled><img src="../assets/alter-tabs/cherry-tab-selected.png" alt="" /><span><b>Elliot</b><small>Designer</small></span><em>⌄</em></button>
            <button class="alter rest" type="button" disabled><img src="../assets/alter-tabs/cherry-tab-rest.png" alt="" /><span><b>Elliot</b><small>Programmer</small></span><em>⌄</em></button>
            <button class="alter rest" type="button" disabled><img src="../assets/alter-tabs/cherry-tab-rest.png" alt="" /><span><b>Elliot</b><small>Debugger</small></span><em>⌄</em></button>
            <button class="alter rest" type="button" disabled><img src="../assets/alter-tabs/cherry-tab-rest.png" alt="" /><span><b>Elliot</b><small>Researcher</small></span><em>⌄</em></button>
            <button class="alter rest" type="button" disabled><img src="../assets/alter-tabs/cherry-tab-rest.png" alt="" /><span><b>Elliot</b><small>Artist</small></span><em>⌄</em></button>
          </div>
        </section>

        <section class="canvas" aria-label="Future conversation canvas">
          <div class="canvas-label"><p>Conversation canvas</p><h2>Live conversation surface will<br />appear here.</h2></div>
          <aside class="tools-layer" aria-label="Future Tools layer">
            <img src="../assets/floating-glass-pane.png" alt="" />
            <div class="tools-copy"><header><span>Tools</span><b aria-hidden="true">×</b></header><ul><li><i class="file-icon" aria-hidden="true"></i>Recent files</li><li><i class="bolt-icon" aria-hidden="true">ϟ</i>Quick actions</li><li><i class="clock-icon" aria-hidden="true"></i>Current work</li></ul></div>
          </aside>
          <span class="tools-handle" aria-label="Future Tools handle">⌁</span>
        </section>

        <footer class="working-strip"><span><i class="dot"></i>Working set</span><b></b><span><i class="download-icon" aria-hidden="true">↓</i>Downloads</span></footer>
      </section>
    </main>
    <script>
      (() => {
        const parameters = new URLSearchParams(window.location.search);
        const sha = parameters.get("cherryPitProvenanceSha") || "missing-sha";
        const utc = parameters.get("cherryPitProvenanceUtc") || "missing-utc";
        const root = parameters.get("cherryPitProvenanceRoot") || "missing-root";
        document.getElementById("provenance-values").textContent = `— ${sha} — ${utc}`;
        console.info(`[Cherry Pit provenance] root=${root} sha=${sha} utc=${utc} href=${window.location.href}`);
      })();
    </script>
  </body>
</html>
